name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # bash stops at the first failing command on every OS, including Windows.
    shell: bash

jobs:
  node:
    name: Node.js ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Cow's minimum Node.js version, and the current release line.
        node: ['22.16', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run test:package
      - name: Website
        run: |
          node --test website/website.test.mjs
          node bin/cow.mjs check website/site
      - name: Examples
        run: |
          for example in forum mininews uploads info; do
            npm test --prefix "examples/$example"
          done

  runtimes:
    name: Bun, Deno and Nub on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          # Cow's minimum supported versions.
          bun-version: 1.4.2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - name: Install Nub 0.9.2
        # Point COW_NUB at Nub's platform binary. On Windows, Cow refuses
        # npm's .cmd wrappers and needs the real executable.
        run: |
          npm install --prefix "$RUNNER_TEMP/nub" --no-save --no-audit --no-fund @nubjs/nub@0.9.2
          node -e "
            const { join } = require('node:path'), fs = require('node:fs')
            const bin = join(process.env.RUNNER_TEMP, 'nub', 'node_modules', '@nubjs', 'nub-' + process.platform + '-' + process.arch, 'bin')
            const exe = fs.readdirSync(bin).find(name => name === 'nub' || name === 'nub.exe')
            fs.appendFileSync(process.env.GITHUB_ENV, 'COW_NUB=' + join(bin, exe) + require('node:os').EOL)
          "
      - run: npm ci
      - run: npm run test:bun
      - run: npm run test:deno
      - name: One site on Node.js, Bun, Nub and Deno
        run: npm run test:runtimes

  postgres:
    name: Postgres on Node.js, Bun and Deno
    # GitHub runs service containers on Linux runners only.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cow
          POSTGRES_PASSWORD: cow
          POSTGRES_DB: cow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cow"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      COW_TEST_POSTGRES_URL: postgres://cow:cow@localhost:5432/cow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - run: npm ci
      - run: node --test --test-reporter=spec test/postgres.test.mjs
      - run: bun test/bun-conformance.mjs test/postgres.test.mjs
      - run: deno test --allow-all --no-check --no-config --node-modules-dir=manual test/postgres.test.mjs
